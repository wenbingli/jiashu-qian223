}\n    ],\n    sources: [\n      { tag: \"shi\", text: \"惊的信问候「新负」，嘱咐她照看两位老人。这是秦代前线士兵家书里唯一一句对妻子说的话。\" },\n      { tag: \"tui\", text: \"不识字、请人念信，是推断。秦代识字率没有统计，推测女性识字的更少。\" },\n      { tag: \"xu\", text: \"你抱着信去找人、念信要钱的情节为虚构。\" }\n    ],\n    gap: \"那些被写信嘱咐的女人，自己怎么想，没有人记下来。\",\n    next: \"tian\"\n  },\n\n  tian: {\n    when: \"秦王政二十四年（前222） · 安陆\",\n    title: \"田与赋\",\n    body: [\n      \"丈夫不在，地还是要种。县里来收赋，按户算，一户多少，你家也得交。\",\n      \"你问婆婆：要不要去县里说丈夫在前线，能不能少交一点。婆婆说：不去，交了就是了。\"\n    ],\n    doc: {\n      text: \"户赋，户一算。\",\n      from: \"汉简《二年律令·户律》。秦汉的户赋按户征收。秦制具体数额待考。\",\n      tag: \"tui\", todo: true\n    },\n    choices: [\n      { text: \"种地、交赋\", fx: { hp: -1, money: -200 },\n        risk: { chance: 0.25, fx: { hp: -2, money: -250 }, text: \"你跟着婆婆下地。手上的泡还没好，又磨出了新的。那年夏天大旱，收成不好，赋还是要交，只能借钱。\" },\n        result: \"你跟着婆婆下地。手上的泡还没好，又磨出了新的。赋交了。\" },\n      { text: \"去县里说丈夫在前线，请求减免\", fx: { money: -150 },\n        risk: { chance: 0.4, fx: { home: -1 }, text: \"吏说，户赋是按户的，不是按人。你回来，婆婆说你惹事。\" },\n        result: \"吏记下了你的话，说：前线的人多了，县里知道。这一年赋少交了一点。\" }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"秦的户赋制度，学界根据汉律和秦简推测是按户征收，不完全按人口。具体到丈夫从军的户怎么收，没有直接记载。\" },\n      { tag: \"xu\", text: \"你去县里请求减免的情节为虚构。\" }\n    ],\n    gap: \"丈夫被征发，留下的妻子怎么种地、交赋、撑家，史料几乎不写。\",\n    next: \"xiaoxi\"\n  },\n\n  xiaoxi: {\n    when: \"秦王政二十五年（前222）\",\n    title: \"消息\",\n    body: [\n      \"仗打完了。陆续有人回来。你每天去村口等。\"\n    ],\n    choices: [\n      { text: \"等消息\", fx: {}, result: \"你等了很久。\" }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"士兵家属等消息，是推断。史书只记战争结果，不记等待的人。\" },\n      { tag: \"xu\", text: \"你去村口等的情节为虚构。\" }\n    ],\n    gap: \"前线的仗打完了，家里的人怎么等消息，史书不写。\",\n    next: s => {\n      const r = Math.random();\n      if (r < 0.28) return \"fugui\";\n      if (r < 0.70) return \"fuhuan\";\n      if (r < 0.87) return \"exun\";\n      return \"wuyin\";\n    }\n  }\n};\n\n<\/script>\n<script>/* data/qi-endings.js */\n// 妻子视角《新负》：后续事件、结局、词条\nObject.assign(window.QI_EVENTS, {\n  fugui: {\n    when: \"秦王政二十五年（前222） · 安陆\",\n    title: \"夫归\",\n    body: [\n      \"丈夫回来了。他瘦了很多，脸上有一道疤。他带回了钱、一身功劳、一块铜牌。\",\n      \"婆婆说：有功了，家里日子能好过一点了。\"\n    ],\n    doc: {\n      text: \"斩首者……赐爵一级。\",\n      from: \"《军爵律》相关记载。秦以军功授爵，有功者家属也能得到好处。\",\n      tag: \"shi\", todo: true\n    },\n    choices: [\n      { text: \"收拾屋子，准备过日子\", fx: { money: 600, home: 2 }, set: [\"fugui\"],\n        risk: { chance: 0.1, fx: { money: -400, home: -1 }, text: \"你把带回来的钱收好。过了一年，公公病了，花光了钱。丈夫说：地先不买了。\" },\n        result: \"你把带回来的钱收好。丈夫说，过两年再买点地。\" }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"士兵回家后家里的变化，是推断。《军爵律》记载有功者能得爵位和田宅，但具体到一户人家是什么样子，没有详细记录。\" },\n      { tag: \"xu\", text: \"丈夫带着疤回来、你收拾屋子的情节为虚构。\" }\n    ],\n    gap: \"从前线回来的人，回到家里后怎么过日子，史书不写。这个结局建立在秦赢了这场仗的前提上。站在楚兵家属的角度，归来的概率要低得多。\",\n    next: \"keshi\"\n  },\n\n  exun: {\n    when: \"秦王政二十五年（前222） · 安陆\",\n    title: \"恶讯\",\n    body: [\n      \"同村回来的人告诉你：丈夫死在前线。县里派人来，核实了名字，记在簿上，说会按律给抚恤。\",\n      \"婆婆哭了一夜。第二天她对你说：你还年轻。\"\n    ],\n    doc: {\n      text: \"战死事不存，令其后。\",\n      from: \"睡虎地秦简《军爵律》。士兵战死，家属能得到一定抚恤。具体数额待考。\",\n      tag: \"shi\", todo: true\n    },\n    choices: [\n      { text: \"留在夫家，照看两位老人\", fx: { home: 1, money: -300 }, set: [\"shousang\"],\n        risk: { chance: 0.35, fx: { money: -350, home: -2 }, text: \"你留了下来。地还要种，赋还要交。两位老人年纪大了，你要照看他们，地里的活越来越重。\" },\n        result: \"你留了下来。地还要种，赋还要交。\" },\n      { text: \"回娘家住一阵\", fx: { home: -1 }, result: \"你回了娘家。婆婆送你到村口，说：想好了再回来。\" }\n    ],\n    sources: [\n      { tag: \"shi\", text: \"秦律规定战死者家属有抚恤，但秦代寡妇的生活状况，史料记载很少。\" },\n      { tag: \"tui\", text: \"婆婆的话、你的选择为推断。\" },\n      { tag: \"xu\", text: \"婆婆哭了一夜、你回娘家的情节为虚构。\" }\n    ],\n    gap: \"丈夫死在前线，留下的妻子后来怎样了，史书几乎不写。\",\n    next: \"keshi\"\n  },\n\n  wuyin: {\n    when: \"秦王政二十五年（前222） · 安陆\",\n    title: \"无音\",\n    body: [\n      \"很多人回来了，但你丈夫没有。你去县里问，簿上没有他的名字，也没有说他死了。\",\n      \"婆婆说：再等等。你们一直等着。\"\n    ],\n    choices: [\n      { text: \"继续等\", fx: { home: -1 }, set: [\"wuyin\"], result: \"你每隔几个月去一次县里。簿上还是没有他的名字。\" }\n    ],\n    sources: [\n      { tag: \"xu\", text: \"丈夫失踪、你去县里查的情节为虚构。秦代对失踪士兵的家属有没有处理办法，没有记载。\" }\n    ],\n    gap: \"前线失踪的人，家里的人怎么办，史书不写。\",\n    next: \"keshi\"\n  },\n\n  fuhuan: {\n    when: \"秦王政二十五年（前222） · 安陆\",\n    title: \"夫还\",\n    body: [\n      \"丈夫回来了。没有爵位，也没带回什么钱。他的鞋底磨穿了，是一路走回来的。\",\n      \"他睡了两天。第三天起来，问的第一件事是地里种了什么。\"\n    ],\n    choices: [\n      { text: \"把这几年的账一笔笔说给他听\", fx: { home: 1 }, set: [\"fuhuan\"],\n        risk: { chance: 0.25, fx: { money: -300, hp: -1 }, text: \"他听完没说话。那年冬天他的旧伤发作，起不了床，地里的活还是你来干。\" },\n        result: \"他听完说：这几年辛苦你了。第二年春天，他和你一起下了地。\" }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"秦灭楚之战中，活着回乡、没有立功的人是多数还是少数，史书没有数字。本游戏按士兵线的结局比例设定。\" },\n      { tag: \"xu\", text: \"丈夫徒步回乡、问地里种了什么的情节为虚构。\" }\n    ],\n    gap: \"活着回来、没有功劳的人最多，也最没有记录。他们回到田里，就从史书里消失了。这个结局建立在秦赢了这场仗的前提上。\",\n    next: \"keshi\"\n  },\n\n  keshi: {\n    when: \"秦始皇二十八年（前219） · 安陆\",\n    title: \"刻石\",\n    body: [\n      \"秦始皇巡行到了会稽，在那里刻了石，石上的字传回了安陆。里里识字的人念给大家听：\",\n      \"「有子而嫁，倍死不贞。防隔内外，禁止淫佚，男女絜诚。」\",\n      \"婆婆听了，看着你。\"\n    ],\n    extra: [\n      { if: \"fugui\", text: \"丈夫在旁边说：刻就刻吧，和咱家没关系。\" },\n      { if: \"fuhuan\", text: \"丈夫蹲在门口磨镰刀，没有抬头。\" }\n    ],\n    doc: {\n      text: \"有子而嫁，倍死不贞。防隔内外，禁止淫佚，男女絜诚。\",\n      from: \"《史记·秦始皇本纪》会稽刻石。意思是：有了孩子还改嫁，是背叛死者、不守贞节。\",\n      tag: \"shi\", todo: true\n    },\n    choices: [\n      { text: \"记在心里\", fx: {}, result: \"你没说话。\" },\n      { if: \"shousang\", text: \"问婆婆：刻石说的是我吗？\", fx: { home: 1 }, result: \"婆婆说：你守着家，石头管不着你。\" }\n    ],\n    sources: [\n      { tag: \"shi\", text: \"会稽刻石是秦始皇巡行时立的，歌颂秦德，其中有对妇女改嫁的谴责。这是官方意识形态。\" },\n      { tag: \"tui\", text: \"会稽的刻石内容有没有传回南郡安陆、普通人知不知道，是推断。\" },\n      { tag: \"xu\", text: \"婆婆看着你、你们的对话为虚构。\" }\n    ],\n    gap: \"秦代妇女听到这些话会怎么想，史书不写。秦律并不禁止寡妇改嫁，但官方在宣扬「不贞」的观念。\",\n    next: s => s.flags.has(\"shousang\") ? \"gaijia\" : \"END\"\n  },\n\n  gaijia: {\n    when: \"秦始皇二十八年（前219）后 · 安陆\",\n    title: \"改嫁\",\n    body: [\n      \"有媒人来说，另一个村的男人死了妻子，想续弦。\",\n      \"婆婆说：你自己拿主意。\"\n    ],\n    doc: {\n      text: \"（大意）秦律对寡妇改嫁没有禁止性规定。《法律答问》里有改嫁后财产、子女归属的案例。\",\n      from: \"睡虎地秦简《法律答问》相关条文，具体简号待核。\",\n      tag: \"shi\", todo: true\n    },\n    choices: [\n      { text: \"答应改嫁\", fx: { money: 300, home: -2 }, set: [\"gaijia\"], result: \"你走的那天，婆婆把你送到村口，没有再说什么。\" },\n      { text: \"留下来\", fx: { home: 1 }, result: \"你对媒人说：不嫁了。婆婆听了，点了点头。\" }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"秦律允许寡妇改嫁，是根据《法律答问》里改嫁后的财产、子女案例推断的，没有明文「允许」的条文。\" },\n      { tag: \"xu\", text: \"媒人来说、婆婆让你自己拿主意的情节为虚构。\" }\n    ],\n    gap: \"秦代寡妇改嫁的实际情况，留下的记录很少。律文只管财产和子女，不管人。\",\n    next: \"END\"\n  }\n});\n\nwindow.QI_ENDINGS = [\n  {\n    id: \"qi_si\", test: s => s.hp <= 0,\n    title: \"死于疫\",\n    text: \"你病倒了。村里人说是疠。你被隔在屋里，没人敢进。你死的时候，婆婆在门外哭。\",\n    gap: \"秦律对疠（传染病）有隔离规定，但病死的人家里后来怎样，史书不写。\"\n  },\n  {\n    id: \"shishi\", test: s => s.money < 100 && s.home <= 1,\n    title: \"室弗遗\",\n    text: \"地卖了，粮食吃光了，家散了。婆婆去了亲戚家，你回了娘家。这个家就这样没了。\",\n    gap: \"「室弗遗」在秦简里指户绝、家散。多少户在战争、徭役、赋税里散掉了，史书没有数字。\"\n  },\n  {\n    id: \"fugui\", test: s => s.flags.has(\"fugui\"),\n    title: \"夫贵\",\n    text: \"丈夫有了功，家里买了地，日子一年比一年好。你生了儿子。后来听说天下大乱，但战火没有烧到安陆。你和丈夫都活了下来。\",\n    gap: \"有军功的家庭在秦末是什么样子，史书只记制度，不记人。\"\n  },\n  {\n    id: \"fuhuan_end\", test: s => s.flags.has(\"fuhuan\"),\n    title: \"夫还\",\n    text: \"丈夫回来了，没有爵位，也没有钱。你们一起种那几亩地，交赋，服徭役。他每年都要被征发一次，你每年都在村口送他、等他。后来天下乱了，你们还在种地。\",\n    gap: \"史书记下了立功的人和战死的人数目的空白，却没有记下最多的那一种人：活着回来、什么也没得到的人。\"\n  },\n  {\n    id: \"gaijia_end\", test: s => s.flags.has(\"gaijia\"),\n    title: \"再醮\",\n    text: \"你改嫁了。新的夫家离安陆不远，你偶尔能见到婆婆。她老了很多。你没有再回到那个村子。\",\n    gap: \"秦汉之际改嫁的女人后来怎样，史书不写。\"\n  },\n  {\n    id: \"shousang\", test: s => s.flags.has(\"shousang\") && !s.flags.has(\"gaijia\"),\n    title: \"寡守\",\n    text: \"你留在夫家，照看两位老人，种那三亩地。后来天下大乱，你听说刘邦起兵，也听说项羽起兵。你不知道他们是谁，只知道要继续种地、交赋。\",\n    gap: \"秦末守寡的女人，史书几乎不写。\"\n  },\n  {\n    id: \"wuyin_end\", test: s => s.flags.has(\"wuyin\"),\n    title: \"终不返\",\n    text: \"丈夫一直没有回来。你等了很多年，簿上始终没有他的名字。后来天下乱了，县里的簿也不知道去了哪里。\",\n    gap: \"战争中失踪的士兵，家里的人等了多久，史书不写。\"\n  },\n  {\n    id: \"qi_mo\", test: () => true,\n    title: \"新负\",\n    text: \"你是那个被写在信里的「新负」。信里只有一句话是对你说的：「勉力视瞻两老」。你照着做了。后来信丢了，但你还记得那句话。\",\n    gap: \"秦代的女人，史书几乎不给名字，只给称呼：妻、母、女、新负。\"\n  }\n];\n\nwindow.QI_GLOSSARY = {\n  \"新负\": {\n    term: \"新负\", tag: \"shi\",\n    def: \"一般释为「新妇」，指新婚的妻子。惊的家书里用这个词问候妻子。\",\n    src: \"惊的家书（睡虎地6号木牍）\",\n    todo: true,\n    note: \"「负」「妇」在古文里常通用。\"\n  },\n  \"户赋\": {\n    term: \"户赋\", tag: \"shi\",\n    def: \"按户征收的赋税。秦汉的户赋是主要税种之一。\",\n    src: \"汉简《二年律令·户律》，秦制待考。\",\n    todo: true\n  },\n  \"会稽刻石\": {\n    term: \"会稽刻石\", tag: \"shi\",\n    def: \"秦始皇二十八年（前219）巡行到会稽时刻的石，歌颂秦德，谴责改嫁和淫乱。\",\n    src: \"《史记·秦始皇本纪》\",\n    note: \"刻石内容有没有传回内地，是推断。\"\n  },\n  \"禅裙襦\": {\n    term: \"禅裙襦\", tag: \"shi\",\n    def: \"可能指夹层或单层的裙和短衣，具体形制不详。黑夫在信里要家里做这个寄去前线。\",\n    src: \"黑夫家书\",\n    todo: true\n  }\n};\n\n<\/script>\n<script>/* data/chubing-events.js */\n// 楚兵视角《项燕》：事件数据。时间前225—前223，败者视角\n// 主角是虚构的楚国士兵，家在淮南某县\nwindow.CHUBING_EVENTS = {\n  zhengfa: {\n    when: \"秦王政二十二年（前225） · 淮南\",\n    title: \"征发\",\n    body: [\n      \"秦军又来了。去年李信打到郢陈，今年听说秦王派了更多的兵。\",\n      \"县里征发：能拿得动戈的男子，都要去。你被编入队伍，往北走。临行前，母亲给你装了一袋粟。\"\n    ],\n    doc: {\n      text: \"秦王召王翦……强起之，遂将兵五十万人。\",\n      from: \"《史记·王翦列传》。王翦率军伐楚，秦方投入兵力远超李信的二十万。\",\n      tag: \"shi\", todo: true\n    },\n    choices: [\n      { text: \"和同村的人编在一起\", fx: { jia: 1, qi: 1 }, result: \"队伍里有你认识的人。你们约好，活着就一起回来。\" },\n      { text: \"一个人走\", fx: { qi: -1 }, result: \"你不认识队伍里的人。他们说的口音和你家乡不太一样。\" }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"楚国征兵的具体方式，史书没有详细记载。秦有《傅律》登记适龄男子，楚是否有类似制度，不详。\" },\n      { tag: \"xu\", text: \"你被征发、母亲送粟的情节为虚构。\" }\n    ],\n    gap: \"楚国士兵怎么被征发、家里怎么送行，没有留下记录。\",\n    next: \"shousheng\"\n  },\n\n  shousheng: {\n    when: \"秦王政二十二年（前225） · 城父一带\",\n    title: \"首胜\",\n    body: [\n      \"你们在城父一带和李信的军队打了一仗。秦军败了，往西退。你们追。\",\n      \"什长说：这一仗打赢了，李信丢了七个都尉。队伍里有人欢呼。\"\n    ],\n    doc: {\n      text: \"李信攻平与，蒙恬攻寝，大破荆军。信又攻郸与，破之，遂至城父。荆人因随之，三日三夜不顿舍，大破李信军，入两壁，杀七都尉。\",\n      from: \"《史记·王翦列传》。李信军在城父被楚军追击、大败。\",\n      tag: \"shi\", todo: true\n    },\n    choices: [\n      { text: \"跟着队伍追击\", fx: { qi: 2, hp: -1 }, result: \"你追了三天。秦军丢下了很多辎重。你捡到一只铜釜。\" },\n      { text: \"追击途中掉队，休息一天\", fx: { liang: -1, qi: -1 }, result: \"你跟不上了。第二天才追上队伍，什长没说什么。\" }\n    ],\n    sources: [\n      { tag: \"shi\", text: \"李信败于城父，是秦灭楚过程中秦军少有的大败。《史记》记了败的结果，没记楚军怎么追。\" },\n      { tag: \"xu\", text: \"你追击途中的选择和捡到铜釜的情节为虚构。\" }\n    ],\n    gap: \"城父之战，秦方有家书（「攻反城久，伤未可知也」），楚方什么都没留下。追击的人是谁、后来怎样，不知道。\",\n    next: \"jiaxun\"\n  },\n\n  jiaxun: {\n    when: \"秦王政二十三年（前224） · 淮南\",\n    title: \"家讯\",\n    body: [\n      \"追击李信后，你们退回淮南一带。听说秦王又派了王翦，带着六十万人南下。\",\n      \"有人从你家乡方向来，说秦军占了几个县，很多人逃到寿春去了。你家还在，但地没人种了。\"\n    ],\n    doc: {\n      text: \"（秦王政）二十三年，王翦遂定荆江南地。\",\n      from: \"《史记·秦始皇本纪》。王翦平定楚地的过程，史书只记了结果。\",\n      tag: \"shi\", todo: true\n    },\n    choices: [\n      { text: \"托人捎信回家，让家人往南逃\", fx: { jia: -1, liang: -1 }, result: \"你把粟分了一半给捎信的人。不知道信能不能到。\" },\n      { text: \"等仗打完再说\", fx: { qi: -1 }, result: \"你想：打完这一仗就能回去了。\" }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"王翦南下时，楚地百姓逃散、田地荒芜，是根据战争常见情形推断的，没有直接记载。\" },\n      { tag: \"xu\", text: \"你听到家讯、托人捎信的情节为虚构。\" }\n    ],\n    gap: \"楚地被占领时，留在后方的人怎么过日子、前线的士兵能不能得到消息，史书不写。\",\n    next: \"daijun\"\n  },\n\n  daijun: {\n    when: \"秦王政二十三年（前224） · 淮南\",\n    title: \"待军\",\n    body: [\n      \"王翦的大军到了，扎营，不出战。你们在营外列阵，对面的秦军不动。\",\n      \"这样过了很久。粮越来越少，队伍里开始有人逃。\"\n    ],\n    doc: {\n      text: \"王翦至，坚壁而守之，不肯战。楚兵数出挑战，终不出。\",\n      from: \"《史记·王翦列传》。王翦坚守不战，等楚军疲惫。\",\n      tag: \"shi\", todo: true\n    },\n    choices: [\n      { text: \"留在队伍里\", fx: { liang: -2, qi: -1 },\n        risk: { chance: 0.5, fx: { jia: -2, qi: -1 }, set: [\"jiaxian\"],\n          text: \"新来的人说，你家乡那几个县已经被秦军占了。他没见到你家里人。那天夜里，营里有好几个人哭。\" },\n        result: \"你每天吃一顿。营里的粟不够分了。\" },\n      {\n        text: \"夜里逃出营，想回家看看\", fx: { liang: 1, jia: -2 },\n        risk: { chance: 0.4, fx: { hp: -3 }, text: \"路上遇到秦军的哨骑。你躲在草丛里，被砍了一刀，逃了出来。\" },\n        result: \"你回到家，屋顶塌了一半，母亲和弟弟不在。邻居说他们往寿春去了。你找到埋在地里的一点粟，又回到了营里。\"\n      }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"楚军对峙期间缺粮、有人逃散，是根据《史记》「楚兵数出挑战，终不出」和战争常理推断的。\" },\n      { tag: \"xu\", text: \"你逃营回家的情节为虚构。秦律对逃兵处罚很重，楚是否有类似律令不详。\" },\n      { tag: \"tui\", text: \"王翦对峙期间，秦军是否已占领淮南诸县，史书没有逐县记载。“家乡被占”的消息是推断。\" }\n    ],\n    gap: \"对峙的时候，楚军营里发生了什么、士兵在想什么，史书不写。\",\n    next: s => s.hp <= 0 ? \"END\" : \"xiangyan\"\n  },\n\n  xiangyan: {\n    when: \"秦王政二十四年（前223） · 蕲南\",\n    title: \"项燕\",\n    body: [\n      \"队伍往东撤。秦军追上来了。\",\n      \"什长说：项燕将军下令，全军在蕲南列阵。队伍里没有人说话。\"\n    ],\n    doc: {\n      text: \"荆数挑战而秦不出，乃引而东。翦因举兵追之，令壮士击，大破荆军。至蕲南，杀其将军项燕。\",\n      from: \"《史记·王翦列传》。蕲南之战，项燕战死，楚军溃败。\",\n      tag: \"shi\", todo: true\n    },\n    choices: [\n      { text: \"跟着队伍到蕲南\", fx: { qi: -1 },\n        risk: { chance: s => s.liang <= 1 ? 0.45 : s.liang <= 2 ? 0.25 : 0.08, fx: { hp: -3 },\n          text: \"往东撤的路上，粮早就断了。你饿得走不动，倒在路边好几次，是同伍的人把你拽起来的。\" },\n        result: \"你看见前面很多人，看不见项燕在哪里。\" }\n    ],\n    sources: [\n      { tag: \"shi\", text: \"项燕之死另有一说：《秦始皇本纪》记他在兵败后自杀。两种说法并存。\" },\n      { tag: \"tui\", text: \"项燕是否在蕲南对全军讲话或下令，没有记载。游戏只写「项燕将军下令」，不写他的话和形象。\" },\n      { tag: \"tui\", text: \"楚军东撤时缺粮、有人饿倒，是根据《王翦列传》“荆数挑战而秦不出，乃引而东”推断的。楚军为什么东撤，史书没说，缺粮是常见的解释之一。\" },\n      { tag: \"xu\", text: \"什长传令、队伍里的反应为虚构。\" }\n    ],\n    gap: \"项燕是楚国最后的将军。《史记》记下了他的死，没有记下他麾下士兵的名字。十四年后，陈胜起兵时借了他的名字。\",\n    next: \"kuibai\"\n  }\n};\n\n<\/script>\n<script>/* data/chubing-endings.js */\n// 楚兵视角《项燕》：结局、词条\nObject.assign(window.CHUBING_EVENTS, {\n  kuibai: {\n    when: \"秦王政二十四年（前223） · 蕲南\",\n    title: \"溃败\",\n    body: [\n      \"队伍散了。你身边的人在逃，秦兵在追。有人倒下了，你不知道是谁。\",\n      \"你也在跑。\"\n    ],\n    choices: [\n      { text: \"往南逃\", fx: { hp: -1 },\n        risk: { chance: 0.5, fx: { hp: -5 }, text: \"一支箭射中了你的背。你倒在地上。\" },\n        set: [\"shanzhong\"], result: \"你逃进了山里。\" },\n      { text: \"扔掉武器，跪下\", fx: { qi: -2 }, set: [\"jiangfu\"], result: \"秦兵把你和其他人绑在一起，押往后方。\" },\n      { text: \"往西北方向逃，想回家\", fx: { hp: -2, qi: -1 }, set: [\"taosan\"], result: \"你一路往西北走。走了很多天。\" }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"蕲南之战后，楚军溃散、被俘、逃亡的具体情况，史书没有记载。\" },\n      { tag: \"xu\", text: \"你在溃败中的选择为虚构。\" }\n    ],\n    gap: \"蕲南之战，楚军「遂败走」。往哪里走、走到了哪里、有多少人活下来，史书没有数字。\",\n    next: \"END\"\n  }\n});\n\nwindow.CHUBING_ENDINGS = [\n  {\n    id: \"chubing_si\", test: s => s.hp <= 0,\n    title: \"死于军中\",\n    text: \"你死在军中。也许是在蕲南的阵前，也许是在往东撤的路上，也许是在营里发热的那几天。没有人记下是哪一种。没有人知道你的名字。十四年后，陈胜起兵时说自己是项燕的人。你们的将军变成了一个符号，而你们连符号都不是。\",\n    gap: \"秦灭楚之战，楚国士兵死于战斗、饥饿、疫病的各有多少，史书没有记载。《史记》只写了「杀其将军项燕」。\"\n  },\n  {\n    id: \"jiangfu\", test: s => s.flags.has(\"jiangfu\"),\n    title: \"降\",\n    text: \"你被押到秦军营里。有人登记你的名字、籍贯。后来你被编入一队人，往北走。有人说是去修骊山的陵，有人说是去戍边。你不知道去哪里，只知道不能回家了。\",\n    gap: \"蕲南之战后，楚国战俘的去向，史书几乎不写。秦律有「城旦舂」等刑徒类别，其中有多少是楚人，没有数字。\"\n  },\n  {\n    id: \"congchen\", test: s => (s.flags.has(\"taosan\") || s.flags.has(\"shanzhong\")) && s.qi >= 3,\n    title: \"从陈\",\n    text: \"你逃散后不知道该去哪里。秦王政二十六年（前221），秦统一天下。秦二世元年（前209），蕲县大泽乡有人起兵，说自己是公子扶苏和项燕的人。你听到这个消息，往陈去了。你不知道那人是不是真的项燕的部下，但你想：项燕是真的。\",\n    gap: \"陈胜起兵时，有多少是蕲南逃散的楚兵，没有记录。《史记》只写陈胜「诈称公子扶苏、项燕」，没有写那些听到这个名字就去投军的人。\"\n  },\n  {\n    id: \"taosan\", test: s => s.flags.has(\"taosan\") && s.jia >= 2 && s.qi < 3,\n    title: \"归楚\",\n    text: \"你逃回了家。母亲和弟弟从寿春回来了，地也还在。但楚已经亡了，你是「荆人」。县里来的是秦的官吏，登记你的名字，说你要按秦律服徭役。你问：我刚从前线回来。吏说：那是楚的兵，不是秦的。\",\n    gap: \"楚亡之后，逃散的楚兵回到家乡，怎么被秦的基层政权重新编入户籍，史料几乎不写。\"\n  },\n  {\n    id: \"wugui\", test: s => s.flags.has(\"taosan\") && s.jia < 2,\n    title: \"无归\",\n    text: \"你逃回了家。屋子还在，人不在了。邻居说，母亲和弟弟往寿春去了，后来不知道去了哪里。你在家里住了几天，县里来了秦的官吏，登记户口。你说你是这里的人。吏说：你家是空户，要迁到别处去。你问能不能去寿春找家人。吏说：不知道。\",\n    gap: \"战乱中失散的家庭，史书不记。秦统一后的户口整理，留下了一些简牍，但看不到一个个家庭的命运。\"\n  },\n  {\n    id: \"wuxun\", test: s => s.flags.has(\"taosan\") || s.flags.has(\"shanzhong\"),\n    title: \"无讯\",\n    text: \"你逃出了蕲南，走了很久。你想回家，但不知道家还在不在。路上遇到的人说，楚已经亡了。你问：那我该去哪里。没有人回答你。\",\n    gap: \"蕲南之战后逃散的楚兵，去了哪里、活了多久、见没见到家人，史书不写。他们在战后的混乱里消失了。\"\n  },\n  {\n    id: \"chubing_mo\", test: () => true,\n    title: \"楚卒\",\n    text: \"你是蕲南之战里的一个楚国士兵。《史记》写了那场战役，写了项燕的死，没有写你。十四年后有人借了项燕的名字起兵，也没有人提起你们。\",\n    gap: \"秦灭楚之战，楚国士兵的记录几乎为零。今天看到的是秦（胜利者）的叙事，但那天在蕲南的人，不只有秦兵。\"\n  }\n];\n\nwindow.CHUBING_GLOSSARY = {\n  \"项燕\": {\n    term: \"项燕\", tag: \"shi\",\n    def: \"楚国末期的将军，在蕲南之战中战死（一说兵败自杀）。《史记》为他立传，陈胜起兵时借他的名字。\",\n    src: \"《史记·王翦列传》《秦始皇本纪》《陈涉世家》\",\n    note: \"项燕的后人项羽，后来也成了反秦的重要人物。\"\n  },\n  \"城父\": {\n    term: \"城父\", tag: \"shi\",\n    def: \"楚地地名，今安徽亳州一带。李信军在此被楚军追击、大败。\",\n    src: \"《史记·王翦列传》\",\n    note: \"李信之败是秦灭楚过程中少有的秦军大败。\"\n  },\n  \"蕲南\": {\n    term: \"蕲南\", tag: \"shi\",\n    def: \"楚地地名，今安徽宿州一带。秦楚决战之地，项燕战死于此，楚军溃散。\",\n    src: \"《史记·王翦列传》\",\n    note: \"蕲南之战后，楚国灭亡。十四年后，陈胜在蕲县大泽乡起兵。\"\n  },\n  \"城旦舂\": {\n    term: \"城旦舂\", tag: \"shi\",\n    def: \"秦代刑徒类别。男刑徒叫城旦（白天修城），女刑徒叫舂（舂米）。刑期四年或更长。\",\n    src: \"睡虎地秦简《秦律十八种》等\",\n    note: \"战俘、罪犯可能被判为城旦舂。楚国战俘有多少成为秦的刑徒，没有统计。\"\n  }\n};\n\n<\/script>\n<script>/* data/chubing-pool.js */\n// 楚兵线随机事件池：stage 表示在哪个事件之后插入，每阶段随机抽一个\n// 内文引号一律用「」，避免和外层字符串冲突\nwindow.CHUBING_POOL = [\n  {\n    stage: \"zhengfa\",\n    pool: [\n      {\n        id: \"cb_yue\",\n        when: \"秦王政二十二年（前225） · 行军途中\",\n        title: \"楚月\",\n        body: [\n          \"夜里扎营，有人问今天是几月。管粮的吏说是「屈夕」。同行一个从北边来的人说，秦人管这个月叫别的名字。\",\n          \"你想起家里这时候该收什么了。\"\n        ],\n        doc: {\n          text: \"（大意）睡虎地秦简《日书》中有秦、楚月名的对照，楚月名有「冬夕」「屈夕」「援夕」「刑夷」等。\",\n          from: \"睡虎地秦简《日书》。具体篇名、简号待核。\",\n          tag: \"shi\", todo: true\n        },\n        choices: [\n          { text: \"跟同乡数一数家里这个月该干的农活\", fx: { qi: 1 }, result: \"你们数到一半就不说了。地里的活，今年没人干。\" },\n          { text: \"不去想，早点睡\", fx: {}, result: \"你睡不着，听见营外有人在哼家乡的调子。\" }\n        ],\n        sources: [\n          { tag: \"shi\", todo: true, text: \"包山楚简等楚地文书使用楚月名纪时，说明楚有自己的历法用语。\" },\n          { tag: \"tui\", text: \"秦简里出现秦楚月名对照，一般认为是因为秦治下的楚地还在用楚月名，需要换算。\" },\n          { tag: \"xu\", text: \"营中对话为虚构。\" }\n        ],\n        gap: \"楚国普通士兵怎么记日子，没有留下任何记录。我们知道楚月名，是因为秦人要把它换算成自己的。\"\n      },\n      {\n        id: \"cb_dao\",\n        when: \"秦王政二十二年（前225） · 出征前\",\n        title: \"祷\",\n        body: [\n          \"出发前，里中有人在社前占卜、祷祠，求这一趟能回来。主持的人说，要献点东西才灵。\"\n        ],\n        doc: {\n          text: \"（大意）包山楚简有大量卜筮祭祷记录：贞人占问吉凶，再祷祠太一、司命、先祖等神祇。\",\n          from: \"包山2号楚墓卜筮祭祷简。墓主是楚国的高级官员，年代约前316年，比本游戏早约一百年。\",\n          tag: \"shi\", todo: true\n        },\n        choices: [\n          { text: \"拿出一份口粮献上\", fx: { liang: -1, qi: 1 }, result: \"主持的人念了很长一段话。你听不太懂，但心里松了一点。\" },\n          { text: \"粮要留着路上吃\", fx: {}, result: \"你站在人群后面看了一会儿，走了。\" }\n        ],\n        sources: [\n          { tag: \"tui\", text: \"包山简是贵族的卜筮记录。普通楚人出征前是否、如何祷祠，没有直接史料，这里是推断。\" },\n          { tag: \"xu\", text: \"里中祷祠的场景为虚构。\" }\n        ],\n        gap: \"楚人留下的祷辞，几乎都属于贵族。普通人求过什么神、许过什么愿，没有人记。\"\n      }\n    ]\n  },\n  {\n    stage: \"shousheng\",\n    pool: [\n      {\n        id: \"cb_huo\",\n        when: \"秦王政二十二年（前225） · 城父一带\",\n        title: \"分获\",\n        body: [\n          \"秦军丢下了很多东西：粮袋、衣服、兵器。什长说，缴获要交上去统一分。有人已经往怀里塞了。\"\n        ],\n        choices: [\n          { text: \"如数上交\", fx: { qi: 1 }, result: \"什长记下了你交的东西。后来分粮的时候，你多分到一把粟。\" },\n          {\n            text: \"藏一袋粟在身上\", fx: { liang: 1 },\n            risk: { chance: 0.3, fx: { hp: -1, qi: -1 }, text: \"被人告发了。你挨了一顿鞭子，粟也被收走了一半。\" },\n            result: \"没人发现。夜里你摸了摸那袋粟，觉得踏实。\"\n          }\n        ],\n        sources: [\n          { tag: \"tui\", text: \"楚军如何处置缴获、有没有类似秦律的赏罚条文，史料不详。这一段是推断。\" },\n          { tag: \"xu\", text: \"分获的场景和你的选择为虚构。\" }\n        ],\n        gap: \"秦的军功赏罚留下了律文，楚的没有。我们不知道楚兵打赢一仗能得到什么。\"\n      },\n      {\n        id: \"cb_qinfu\",\n        when: \"秦王政二十二年（前225） · 城父一带\",\n        title: \"秦俘\",\n        body: [\n          \"你们抓到一个掉队的秦兵。他很年轻，说自己是南郡安陆人。他怀里有一块木牍，说是还没寄出去的家书。\",\n          \"安陆以前也是楚的地方。他说话的口音，你听得懂一半。\"\n        ],\n        choices: [\n          { text: \"把他交给什长\", fx: {}, result: \"什长把他押走了。木牍掉在地上，你捡起来，不识字，又扔了。\" },\n          {\n            text: \"趁没人注意，放他走\", fx: { qi: -1 },\n            risk: { chance: 0.25, fx: { hp: -2 }, text: \"被人看见了。什长打了你一顿，问你是不是秦人的奸细。\" },\n            result: \"他往西跑了，没有回头。你不知道他能不能回到安陆。\"\n          }\n        ],\n        sources: [\n          { tag: \"shi\", text: \"安陆所在的南郡，前278年以前属楚，秦兵线、县吏线的主角都来自这里。\" },\n          { tag: \"xu\", text: \"这个秦兵和他的家书为虚构。他可能是秦兵线里的「你」，也可能是黑夫的同乡。\" }\n        ],\n        gap: \"黑夫的家书留下来了，因为它到了家。那些没寄出去的信，和写信的人一起消失了。\"\n      }\n    ]\n  },\n  {\n    stage: \"jiaxun\",\n    pool: [\n      {\n        id: \"cb_yi\",\n        when: \"秦王政二十三年（前224） · 淮南\",\n        title: \"疫\",\n        body: [\n          \"营里有人开始发热、腹泻。先是一个伍，后来是一整个什。死了的人被抬到营外埋了。\"\n        ],\n        choices: [\n          { text: \"照常和同伍的人一起吃住\", fx: {},\n            risk: { chance: 0.4, fx: { hp: -3 }, text: \"你也病倒了。同伍的人把你抬到营边，躺了半个月。有几个和你一起抬出去的人，没有再回来。\" },\n            result: \"你没有病。同伍的五个人里，病了两个。\" },\n          { text: \"搬到营地边上自己睡\", fx: { qi: -1 }, result: \"你一个人睡在风口。同伍的人说你怕死。\" }\n        ],\n        sources: [\n          { tag: \"tui\", text: \"大军长期屯驻容易发生疫病，这是古代战争的常见情况。秦楚对峙期间是否有疫，史书没有记载。\" },\n          { tag: \"xu\", text: \"营中疫病的情节为虚构。\" }\n        ],\n        gap: \"死于疫病的士兵往往比死于战斗的多，但史书只记战斗。\"\n      },\n      {\n        id: \"cb_xiangren\",\n        when: \"秦王政二十三年（前224） · 淮南\",\n        title: \"同乡\",\n        body: [\n          \"新补进来一批人，其中有个你们县的。你问他家里的事。他想了很久，说你家那条巷子的人都走了，往寿春方向。\"\n        ],\n        choices: [\n          { text: \"问他看见我母亲没有\", fx: { jia: -1 },\n            result: \"他说路上人太多，没看清。你又问了一遍，他还是这么说。\" },\n          { text: \"不问了\", fx: { qi: -1 }, result: \"你坐在一边磨戈，磨了很久。\" }\n        ],\n        sources: [\n          { tag: \"tui\", text: \"战时百姓向都城寿春方向逃难，是推断。楚国此时的都城在寿春，见《史记·楚世家》。\" },\n          { tag: \"xu\", text: \"同乡带来的消息为虚构。\" }\n        ],\n        gap: \"前线的人得到的家讯，常常只有半句话。另外半句，可能永远没有了。\"\n      }\n    ]\n  }\n];\n\n<\/script>\n<script>/* data/shang-events.js */\n// 商人视角：事件数据。时间前226—前209，地点陈县\n// 主角是虚构的粮食商人，家在陈县\nwindow.SHANG_EVENTS = {\n  kaishi: {\n    when: \"秦王政二十一年（前226） · 陈县\",\n    title: \"开市\",\n    body: [\n      \"你家在陈县做了两代粮食生意。父亲过世后，铺子归你。\",\n      \"县里的市啬夫认识你，按月收你的租。你每天一早去市，傍晚回家。\",\n      \"这一年，听说秦楚又要开战。有人开始囤粮。\"\n    ],\n    doc: {\n      text: \"（秦王政）二十一年……王贲攻楚，取十馀城。\",\n      from: \"《史记·秦始皇本纪》。秦王政二十一年，秦军再次进攻楚国。\",\n      tag: \"shi\"\n    },\n    choices: [\n      { text: \"跟着囤一批粮，等粮价涨\", fx: { ben: -800, huo: 3, ming: 1 },\n        result: \"你用八百钱进了一批粟，藏在家里。\" },\n      { text: \"不囤，照常做小买卖\", fx: { ben: 100 },\n        result: \"你还是每天去市上，赚得不多，但稳。\" }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"战时商人囤积居奇，史书不记个案，但《史记·货殖列传》说「贪买三之，廉买五之」，战时物价波动是常识。\" },\n      { tag: \"xu\", text: \"你的家庭背景、铺子、选择为虚构。\" }\n    ],\n    gap: \"陈县的市场什么样、商人怎么进货、交多少租，秦代文献几乎不记。\",\n    next: \"zhanshi\"\n  },\n\n  zhanshi: {\n    when: \"秦王政二十二年（前225） · 陈县\",\n    title: \"战事\",\n    body: [\n      \"李信的军队打到郢陈，离陈县不远。县里来了很多逃难的人，都要买粮。\",\n      \"不久，听说李信在城父被楚军打败了。秦军退了，楚军追过来，也要征粮。\",\n      \"你囤的粮可以卖了，但卖给谁？\"\n    ],\n    doc: {\n      text: \"李信攻平与，蒙恬攻寝，大破荆军。信又攻鄢郢，破之，遂至城父。荆人因随之，三日三夜不顿舍，大破李信军。\",\n      from: \"《史记·王翦列传》。李信败于城父后，楚军追击秦军，战场在陈县附近。\",\n      tag: \"shi\"\n    },\n    multi: true,\n    multiHint: \"可以选多个，选完了点「确定」\",\n    choices: [\n      { text: \"卖给秦军\", fx: { ben: 1200, huo: -2, ming: 2 }, set: [\"maiqin\"],\n        result: \"秦军的军吏按官价收了你的粮，给了钱，还记下了你的名字。\" },\n      { text: \"卖给楚军\", fx: { ben: 800, huo: -2, jia: 1 }, set: [\"maichu\"],\n        result: \"楚军的人说「为楚出力」，按市价给了钱，比秦军给得少。\" },\n      { text: \"卖给逃难的人\", fx: { ben: 600, huo: -1 }, set: [\"mainm\"],\n        result: \"你按平时的价卖给难民。他们说你是好人，但钱赚得不多。\" }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"城父之战后，楚军追击，战场转移到陈县一带。商人向军队供粮，史书不记，但《史记·货殖列传》提到「军旅之後，必有凶年」，说明战时粮食买卖是常态。\" },\n      { tag: \"xu\", text: \"你向谁供粮、得到什么回报，为虚构。\" }\n    ],\n    gap: \"战时，陈县的商人做了什么、官府怎么管，没有记录。\",\n    next: s => s.flags.has(\"maiqin\") || s.flags.has(\"maichu\") ? \"wangjian\" : \"tongyihuo\"\n  },\n\n  wangjian: {\n    when: \"秦王政二十三年（前224） · 陈县\",\n    title: \"王翦\",\n    body: [\n      \"第二年，王翦带着大军南下。这次秦军的人更多，粮食也是从各郡征上来的。\",\n      s => s.flags.has(\"maiqin\")\n        ? \"军吏认出了你，说你「曾为秦军供粮」，让你再供一批。\"\n        : \"有军吏来找你，要你供粮给秦军。你说去年卖给了楚军，他记下了你的名字。\"\n    ],\n    doc: {\n      text: \"秦王召王翦……强起之，遂将兵五十万人。\",\n      from: \"《史记·王翦列传》。王翦率五十万大军伐楚，这是秦灭六国战争中兵力最多的一次。\",\n      tag: \"shi\"\n    },\n    choices: [\n      { text: \"答应供粮，再进一批货\", fx: { ben: -500, huo: 2, ming: 2 },\n        result: s => s.flags.has(\"maiqin\")\n          ? \"你又进了一批粮，按官价卖给秦军。军吏说你「知大体」。\"\n          : \"你硬着头皮答应了。军吏说，「既为秦出力，前事不究」。\" },\n      { text: \"说家里没钱了，拒绝\", fx: { ming: -1, jia: -1 },\n        risk: { chance: 0.3, fx: { ben: -300 }, text: \"军吏不信，带人来你家翻了一遍，拿走了一些粮，没给钱。\" },\n        result: \"军吏不高兴，但没为难你。他走后，你松了一口气。\" }\n    ],\n    sources: [\n      { tag: \"tui\", text: \"王翦大军的粮食供应，史书只记「秦悉起兵」，没有记商人的角色。商人被军队「记名」，是根据后来「贾人」被列入谪戍名单的制度推断的。\" },\n      { tag: \"xu\", text: \"军吏找你、你的选择为虚构。\" }\n    ],\n    gap: \"秦军怎么在占领区征粮、和当地商人怎么打交道，史书不写。\",\n    next: \"tongyihuo\"\n  },\n\n  tongyihuo: {\n    when: \"秦王政二十四年（前223） · 陈县\",\n    title: \"统一货\",\n    body: [\n      \"楚亡了。县里的官全换成了秦人。\",\n      \"新的命令下来：从今以后，只准用秦国的半两钱。你手里还有不少楚国的钱。\"\n    ],\n    doc: {\n      text: \"（秦王政二十六年）一法度衡石丈尺。车同轨。书同文字。\",\n      from: \"《史记·秦始皇本纪》。秦统一后推行统一货币、度量衡的政策，但具体何时在楚地实施，史书未明确记载。\",\n      tag: \"shi\"\n    },\n    choices: [\n      { text: \"赶紧把楚钱换成秦钱\", fx: { ben: -200 },\n        result: \"市上有人专门换钱，但汇率很差。你损失了两百钱。\" },\n      { text: \"藏起来，等以后再说\", fx: { huo: 1 }, set: [\"cangqian\"],\n        risk: { chance: 0.25, fx: { ben: -400, ming: 1 }, text: \"县里突然来查，你藏的楚钱被发现了。钱被没收，你的名字又被记上了。\" },\n        result: \"你把楚钱埋在家里。也许以后还能用。\" }\n    ],\n    sources: [\n      { tag: \"shi\", text: \"秦统一货币的政策，《秦始皇本纪》记为二十六年，但楚地何时开始执行，不详。\" },\n      { tag: \"tui\", text: \"商人手中的楚国货币如何处理，史书没有记载，这是根据统一货币政策推断的。\" },\n      { tag: \"xu\", text: \"你的选择和后果为虚构。\" }\n    ],\n    gap: \"统一货币后，民间手里的旧钱怎么办、官府怎么查，没有留下记录。\",\n    next: \"jinbulv\"\n  },\n\n  jinbulv: {\n    when: \"秦王政二十五年（前222） · 陈县市\",\n    title: \"金布律\",\n    body: [\n      \"市上来了新的啬夫，带来一块木牍，上面写着《金布律》。\",\n      \"他宣读：「市场上卖东西要明码标价。收钱的时候,好钱坏钱都得收，不许挑。」\",\n      \"有个卖布的不服，说「钱太烂了，谁要？」啬夫说，「律上这么写的，不服去告。」\"\n    ],\n    doc: {\n      text: \"百姓市用钱，美恶杂之，勿敢异。\",\n      from: \"睡虎地秦简《金布律》。秦律规定市场交易中好钱坏钱都必须收，不得挑拣。\",\n      tag: \"shi\"\n    },\n    choices: [\n      { text: \"照律令做，坏钱也收\", fx: { ben: -100, ming: -1 },\n        result: \"你收了几枚磨损严重的半两钱。后来想用它们买货，对方不肯收，你只能认了。\" },\n      { text: \"挑好钱收，坏钱推掉\", fx: { ming: 1 },\n        risk: { chance: 0.3, fx: { ben: -200 }, text: \"有人去告了你。啬夫罚了你两百钱，说「不遵律令」。\" },\n        result: \"你偷偷挑了几次，暂时没人管。\" }\n    ],\n    sources: [\n      { tag: \"shi\", text: \"《金布律》的内容，出自睡虎地秦简。\" },\n      { tag: \"tui\", text: \"商人对这条律令的反应，史书和简牍都没有记录，这里是根据律文推断的。\" },\n      { tag: \"xu\", text: \"你的选择和啬夫的话为虚构。\" }\n    ],\n    gap: \"《金布律》在市场上怎么执行、商人怎么应对、有多少人被罚，秦代文献不记。\",\n    next: \"jiaren\"\n  },\n\n  jiaren: {\n    when: \"秦王政二十六年（前221） · 陈县\",\n    title: \"贾人\",\n    body: [\n      \"县廷的小吏拿着名籍来找你，说要登记「贾人」。\",\n      \"他问：「你做买卖多少年了？你父亲做过吗？你祖父呢？」\",\n      \"你都老实答了。他在名籍上写了几行字，说：「以后有事，会叫你。」\"\n    ],\n    doc: {\n      text: \"发诸尝逋亡人、赘婿、贾人略取陆梁地，为桂林、象郡、南海，以適遣戍。\",\n      from: \"《史记·秦始皇本纪》。秦始皇三十三年（前214），征发商人等去戍边。「贾人」被单独列为一类，说明此前已有登记。\",\n      tag: \"shi\"\n    },\n    choices: [\n      { text: \"问他登记了干什么\", fx: { ming: 1 },\n        result: \"小吏说：「律令上这么写的，我也不知道。你别多问。」\" },\n      { text: \"什么都不问，低头认了\", fx: { ming: -1 },\n        result: \"小吏走后，你心里不安，但也不敢多想。\" }\n    ],\n    sources: [\n      { tag: \"shi\", text: \"前214年征发「贾人」戍边，说明此前已有「贾人」名籍。\" },\n      { tag: \"tui\", text: \"「贾人」名籍何时登记、怎么登记，史书没有明确记载，这是根据后来的征发推断的。父祖辈是否做过买卖也被登记，是参考汉初「七科谪」的做法。\" },\n      { tag: \"xu\", text: \"小吏的话和你的选择为虚构。\" }\n    ],\n    gap: \"「贾人」名籍怎么登记、商人当时知不知道后果，没有留下记录。\",\n    next: s => s.ming >= 4 ? \"zhengfa_shang\" : \"shiji\"\n  },\n\n  zhengfa_shang: {\n    when: \"秦始皇三十三年（前214） · 陈县\",\n    title: \"征发\",\n    body: [\n      \"县廷的人又来了，这次带着一份征发令。\",\n      \"他说：「你是贾人，朝廷要征你去岭南戍边。准备一下，十天后出发。」\",\n      \"你问能不能不去。他说：「律令上写的，不去就是逋亡，全家连坐。」\"\n    ],\n    doc: {\n      text: \"发诸尝逋亡人、赘婿、贾人略取陆梁地，为桂林、象郡、南海，以適遣戍。\",\n      from: \"《史记·秦始皇本纪》。秦始皇三十三年（前214），征发商人、赘婿、逃亡者等去岭南戍边。\",\n      tag: \"shi\"\n    },\n    choices: [\n      { text: \"去戍边\", fx: { ben: -500, jia: -2 }, set: [\"shushu\"],\n        result: \"你交代了家里的事，跟着队伍往南走。路很远，你不知道什么时候能回来。\" },\n      { text: \"托关系，想办法免役\", fx: { ben: -800, ming: -2 },\n        risk: { chance: 0.4, fx: { ben: -500, jia: -2 }, set: [\"shushu\"], text: \"钱花了，事没成。县廷的人还是把你征走了。\" },\n        result: \"你花了很多钱，找到一个认识县丞的人。县丞在名单上划掉了你的名字。\" }\n    ],\n    sources: [\n      { tag: \"shi\", text: \"前214年征发「贾人」戍边，《秦始皇本纪》有明确记载。\" },\n      { tag: \"tui\", text: \"商人被征发时的反应、能否免役，史书没有记载，这是根据秦代律令和后世类似情况推断的。\" },\n      { tag: \"xu\", text: \"你的选择和托关系的情节为虚构。\" }\n    ],\n    gap: \"被征发的「贾人」有多少、有没有人逃掉、戍边的路上发生了什么，史书不记。\",\n    next: s => s.flags.has(\"shushu\") ? \"END\" : \"shiji\"\n  },\n\n  shiji: {\n    when: \"秦二世元年（前209） · 陈县\",\n    title: \"始计\",\n    body: [\n      \"秦始皇死了，新皇帝即位。听说陈胜、吴广在大泽乡起兵，很快就打到了陈县。\",\n      \"陈县的秦吏逃了。陈胜进城,在陈称王，国号「张楚」。\",\n      \"陈胜的人来征粮，说是「为张楚出力」。你看着他们，想起了当年楚军的人。\"\n    ],\n    doc: {\n      text: \"陈涉乃立为王，号为张楚。\",\n      from: \"《史记·陈涉世家》。陈胜在陈县称王，建立张楚政权。\",\n      tag: \"shi\"\n    },\n    choices: [\n      { text: \"把粮都给了他们\", fx: { ben: -400, huo: -2, jia: 1 }, set: [\"zhang\"],\n        result: \"陈胜的人说你「识大体」，给了你一个「张楚」的官职名号，但没给钱。\" },\n      { text: \"只给一部分，留一些自己用\", fx: { ben: -200, huo: -1 },\n        risk: { chance: 0.3, fx: { ben: -400, huo: -2 }, text: \"他们不满意，又来了一次，把剩下的也拿走了。\" },\n        result: \"你给了一些，藏了一些。他们没有再来。\" },\n      { text: \"说没有粮了，想办法藏起来\", fx: { jia: -1 },\n        risk: { chance: 0.5, fx: { ben: -400, huo: -2, jia: -1 }, text: \"他们不信，翻了你家，把粮都拿走了。你家里人被吓坏了。\" },\n        result: \"你把粮藏到别处。他们来过一次，没找到。\" }\n    ],\n    sources: [\n      { tag: \"shi\", text: \"陈胜在陈县称王，《陈涉世家》有记载。\" },\n      { tag: \"tui\", text: \"陈胜政权如何征粮、陈县商人的反应，史书没有记载，这是根据战时征粮的一般情况推断的。\" },\n      { tag: \"xu\", text: \"陈胜的人征粮和你的选择为虚构。\" }\n    ],\n    gap: \"陈胜在陈县称王后，当地的商人、百姓怎么生活，史书几乎不写。\",\n    next: \"END\"\n  }\n};\n\n<\/script>\n<script>/* data/shang-endings.js */\n// 商人视角：结局、词条\nObject.assign(window.SHANG_EVENTS, {\n  // 结局在 data/roles.js 的 SHANG_ENDINGS 数组里按顺序匹配\n});\n\nwindow.SHANG_ENDINGS = [\n  {\n    id: \"shushu\", test: s => s.flags.has(\"shushu\"),\n    title: \"戍戍\",\n    text: \"你被征发去岭南戍边。路上走了几个月，到了一个叫桂林的地方。那里很热，虫子很多，水土不服的人一个接一个病倒。你在那里修城、开路、和当地人打仗。三年过去了，你还活着，但不知道什么时候能回家。几年后，陈胜起兵的消息传到岭南，有人说可以回去了，也有人说朝廷还没发话。你们在那里等着，等着。\",\n    gap: \"被征发到岭南的「贾人」有多少、死了多少、有没有人回来，史书没有记载。《淮南子》说「戍五岭，与越人战，死者相属」，但具体情况不详。\"\n  },\n  {\n    id: \"zhang\", test: s => s.flags.has(\"zhang\") && s.ben >= 500,\n    title: \"张楚\",\n    text: \"陈胜在陈县称王，你在「张楚」手下做了一个管粮食的小官。每天有人来要粮，你按陈胜的命令发。半年后，秦军打回来了，陈胜逃走,不久被杀。秦军进城，你被抓了。你说你是被逼的，秦军不听，把你和其他「张楚」的官一起处决了。\",\n    gap: \"陈胜政权的基层官吏有多少、后来怎么样了，《史记》只记了几个大将的下场，其他人不知道。\"\n  },\n  {\n    id: \"pochan\", test: s => s.ben < 300,\n    title: \"破产\",\n    text: \"你的本钱没了。铺子关了,家里的地也卖了。你去给人打短工，扛粮食、推车、在码头上搬货。以前认识你的人看见你，有的装作不认识，有的过来说几句话，然后走了。你想起父亲说过，「做买卖，一步错就全完了」。你不知道自己错在哪一步，但确实全完了。\",\n    gap: \"秦代破产的商人有多少、后来做什么，史书不记。《史记·货殖列传》只写成功的商人，失败的不写。\"\n  },\n  {\n    id: \"gaihang\", test: s => s.ben < 800 && s.jia >= 3,\n    title: \"改行\",\n    text: \"你不想再做买卖了。风险太大，官府盯得太紧，赚的钱还不够交各种税和罚款。你把铺子盘给了别人，用剩下的钱买了几亩地,当了农民。种地很累，但至少不用每天担心被官府记名、被征发。你偶尔去市上买东西，看见以前一起做生意的人，大家点点头，不多说话。\",\n    gap: \"有多少商人改行去种地，史书没有记录。商鞅变法时说「事末利者举以为收孥」，但改行的商人能不能真正摆脱「贾人」身份,秦律没有明说。\"\n  },\n  {\n    id: \"taopao\", test: s => s.ming >= 5 || s.jia <= 1,\n    title: \"逃\",\n    text: \"你觉得不能再待在陈县了。官府已经盯上你,家里也出了事。你收拾了一些钱，趁夜里离开了陈县，往东走。路上你听说有人逃到齐地、有人去了南方，都是想躲开官府的人。你不知道自己要去哪里，只知道不能回来了。后来你在一个小县落脚，改了名字，再也不做买卖。\",\n    gap: \"秦代有多少人逃亡、逃到哪里、后来怎么样，史书不记。《秦始皇本纪》里「逋亡人」是一个类别，说明逃亡很普遍，但个案没有留下。\"\n  },\n  {\n    id: \"shang_mo\", test: () => true,\n    title: \"商\",\n    text: \"你还在陈县做生意。战争过去了,新的朝代来了又走了,你还在市上。你见过秦军、楚军、陈胜的人,给他们都供过粮,谁来都是生意。你的本钱比父亲那一代多了一些,但你不敢显出来。你把大部分钱藏起来，只留一小部分做生意。你教儿子，「做买卖的人，要懂得藏」。儿子问：「藏什么？」你说：「藏钱、藏粮、藏自己。」\",\n    gap: \"秦代小商人怎么在制度的夹缝里生存、怎么把生意传给下一代，史书不写。《史记·货殖列传》只记巴寡妇清、乌氏倮这样的大商人，普通商人的生活没有留下。\"\n  }\n];\n\nwindow.SHANG_GLOSSARY = {\n  \"贾人\": {\n    text: \"做买卖的人。秦律把他们单独登记，前214年和「逋亡人」「赘婿」一起被征发去岭南戍边。\",\n    from: \"《史记·秦始皇本纪》：「发诸尝逋亡人、赘婿、贾人略取陆梁地」。\"\n  },\n  \"金布律\": {\n    text: \"秦律的一篇，规定市场交易的规则。比如：卖东西要标价，收钱时好钱坏钱都得收。\",\n    from: \"睡虎地秦简《金布律》。\"\n  },\n  \"张楚\": {\n    text: \"陈胜在陈县称王时建立的政权，国号「张楚」，意思是「张大楚国」。\",\n    from: \"《史记·陈涉世家》：「陈涉乃立为王，号为张楚」。\"\n  },\n  \"市啬夫\": {\n    text: \"管理市场的小官。\",\n    from: \"睡虎地秦简、里耶秦简里都有「市啬夫」。\"\n  },\n  \"半两钱\": {\n    text: \"秦国统一后推行的货币，圆形方孔，上面写「半两」二字。\",\n    from: \"《史记·平准书》：「秦兼天下，币为二等，黄金以溢名，为上币；铜钱质如周钱，文曰半两，重如其文，为下币」。\"\n  }\n};\n\n<\/script>\n<script>\n(function() {\n  const TAG = { shi: \"史载\", tui: \"推断\", xu: \"虚构\" };\n  const $content = document.getElementById(\"content\");\n  const poolOf = P => Object.fromEntries((P || []).flatMap(p => p.pool.map(ev => [ev.id, ev])));\n  const ROLE_EVENTS = { shi: Object.assign({}, window.EVENTS, poolOf(window.EVENT_POOL)), li: window.LI_EVENTS || {}, chu: window.CHU_EVENTS || {}, qi: window.QI_EVENTS || {}, chubing: Object.assign({}, window.CHUBING_EVENTS, poolOf(window.CHUBING_POOL)), shang: window.SHANG_EVENTS || {} };\n  const ROLE_NAME = { shi: \"秦兵\", li: \"县吏\", chu: \"楚民\", qi: \"妻子\", chubing: \"楚兵\", shang: \"商人\" };\n  let currentRole = \"all\";\n\n  function esc(t) {\n    return String(t).replace(/[&<>\"]/g, c => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\" }[c]));\n  }\n\n  function renderDoc() {\n    const docs = [];\n    let html = '<div class=\"section\" id=\"doc\"><h2>史料原文</h2>';\n    for (const role in ROLE_EVENTS) {\n      if (currentRole !== \"all\" && currentRole !== role) continue;\n      const events = ROLE_EVENTS[role];\n      for (const id in events) {\n        const ev = events[id];\n        if (ev.doc) docs.push({ event: ev.title, when: ev.when, ...ev.doc });\n      }\n    }\n    docs.forEach(d => {\n      html += `<div class=\"item\">\n        <h3>${esc(d.event)}</h3>\n        <div class=\"meta\">${esc(d.when)}</div>\n        <span class=\"tag ${d.tag}\">${TAG[d.tag]}</span>${d.todo ? '<span class=\"todo\">［待核］</span>' : ''}\n        <div class=\"text\">${esc(d.text)}</div>\n        <span class=\"from\">${esc(d.from)}</span>\n      </div>`;\n    });\n    html += `<div class=\"count\">共 ${docs.length} 条原文引用</div></div>`;\n    return html;\n  }\n\n  function renderDoc_old() {\n    const docs = [];\n    for (const role in ROLE_EVENTS) {\n      if (currentRole !== \"all\" && currentRole !== role) continue;\n      const events = ROLE_EVENTS[role];\n      for (const id in events) {\n        const ev = events[id];\n        if (ev.doc) docs.push({ title: ev.title, doc: ev.doc, role });\n      }\n    }\n    let html = '<div class=\"section\" id=\"doc\"><h2>史料原文</h2>';\n    docs.forEach(d => {\n      html += `<div class=\"item\">\n        <h3>${esc(d.event)}</h3>\n        <div class=\"meta\">${esc(d.when)}</div>\n        <span class=\"tag ${d.tag}\">${TAG[d.tag]}</span>${d.todo ? '<span class=\"todo\">［待核］</span>' : ''}\n        <div class=\"text\">${esc(d.text)}</div>\n        <span class=\"from\">${esc(d.from)}</span>\n      </div>`;\n    });\n    html += `<div class=\"count\">共 ${docs.length} 条原文引用</div></div>`;\n    return html;\n  }\n\n  function renderSources() {\n    const sources = [];\n    for (const role in ROLE_EVENTS) {\n      if (currentRole !== \"all\" && currentRole !== role) continue;\n      const events = ROLE_EVENTS[role];\n      for (const id in events) {\n        const ev = events[id];\n        if (ev.sources) ev.sources.forEach(s => sources.push({ event: ev.title, ...s }));\n      }\n    }\n    let html = '<div class=\"section\" id=\"sources\"><h2>出处与争议</h2>';\n    sources.forEach(s => {\n      html += `<div class=\"item\">\n        <span class=\"tag ${s.tag}\">${TAG[s.tag]}</span>${s.todo ? '<span class=\"todo\">［待核］</span>' : ''}\n        <div class=\"text\">${esc(s.text)}</div>\n        <div class=\"meta\">来自事件：${esc(s.event)}</div>\n      </div>`;\n    });\n    html += `<div class=\"count\">共 ${sources.length} 条出处说明</div></div>`;\n    return html;\n  }\n\n  function renderGlossary() {\n    let html = '<div class=\"section\" id=\"glossary\"><h2>词条</h2>';\n    for (const term in window.GLOSSARY) {\n      const g = window.GLOSSARY[term];\n      html += `<div class=\"item\">\n        <h3>${esc(g.term)}</h3>\n        <span class=\"tag ${g.tag}\">${TAG[g.tag]}</span>${g.todo ? '<span class=\"todo\">［待核］</span>' : ''}\n        <div class=\"text\">${esc(g.def)}</div>\n        <span class=\"from\">${esc(g.src)}</span>\n        ${g.note ? `<div class=\"text\" style=\"margin-top:8px;color:var(--muted);font-size:14px;\">${esc(g.note)}</div>` : ''}\n      </div>`;\n    }\n    html += `<div class=\"count\">共 ${Object.keys(window.GLOSSARY).length} 个词条</div></div>`;\n    return html;\n  }\n\n  function renderAllSources() {\n    let html = '<div class=\"section\" id=\"sources\"><h2>出处与争议</h2>';\n    for (const role in ROLE_EVENTS) {\n      html += '<h3 style=\"margin-top:24px;border-bottom:1px solid var(--line);padding-bottom:8px;\">' + ROLE_NAME[role] + '</h3>';\n      const allSrc = [];\n      const events = ROLE_EVENTS[role];\n      for (const id in events) {\n        const ev = events[id];\n        if (ev.sources) allSrc.push(...ev.sources.map(s => ({ ...s, ev: ev.title })));\n      }\n      allSrc.sort((a, b) => a.tag.localeCompare(b.tag));\n      allSrc.forEach(s => {\n        html += `<div class=\"source-item\">\n          <span class=\"tag ${s.tag}\">${TAG[s.tag]}${s.todo ? '［待核］' : ''}</span>\n          <span class=\"ev-title\">${esc(s.ev)}</span>\n          <p>${esc(s.text)}</p>\n        </div>`;\n      });\n    }\n    html += '</div>';\n    return html;\n  }\n\n  function updateView() {\n    $content.innerHTML = renderDoc() + renderSources() + renderGlossary();\n  }\n\n  document.querySelectorAll('input[name=\"role\"]').forEach(r => {\n    r.addEventListener(\"change\", e => {\n      currentRole = e.target.value;\n      updateView();\n    });\n  });\n\n  updateView();\n  if (location.hash === \"#shi\") document.querySelector('input[value=\"shi\"]').checked = true, currentRole = \"shi\", updateView();\n  if (location.hash === \"#li\") document.querySelector('input[value=\"li\"]').checked = true, currentRole = \"li\", updateView();\n  if (location.hash === \"#chu\") document.querySelector('input[value=\"chu\"]').checked = true, currentRole = \"chu\", updateView();\n  if (location.hash === \"#qi\") document.querySelector('input[value=\"qi\"]').checked = true, currentRole = \"qi\", updateView();\n  if (location.hash === \"#chubing\") document.querySelector('input[value=\"chubing\"]').checked = true, currentRole = \"chubing\", updateView();\n})();\n<\/script>\n</body>\n</html>\n";
  var frame = document.getElementById("sources-room");

    e.preventDefault();
    if (!frame.srcdoc) frame.srcdoc = SRC;
    frame.style.display = "block";
    document.body.style.overflow = "hidden";
  });
  window.addEventListener("message", function (e) {
    if (e.data !== "jiashu-close-sources") return;
    frame.style.display = "none";
    document.body.style.overflow = "";
  });
})();
</script>
</body>
</html>
